name: CI

on:
  # Triggers the workflow on push or pull request events
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Start containers
      run: |
        set -x
        docker network create public-network
        docker compose up -d
        sudo chmod 777 thumbnails || true
        sleep 2
        docker ps

    - name: Check nginx healthiness
      run: |
        set -x
        curl --http2 -s http://127.0.0.1:2020 | grep -A5 Hello
        curl --http2 -sI http://127.0.0.1:2020/favicon.ico | grep -A5 204
        curl --http2 -s http://127.0.0.1:2020/thumb/a/8/5/a85c303a45cd7a6b3745cb9aaa6b4f19.jpg | file - | grep -i jpeg

    - name: Check that we block bots
      run: |
        set -x
        curl --http2 -svo /dev/null http://127.0.0.1:2020/thumb/a/8/5/a85c303a45cd7a6b3745cb9aaa6b4f19.jpg -A "Googlebot-Image/1.0" 2>&1 | grep -A5 418
        curl --http2 -svo /dev/null http://127.0.0.1:2020/thumb/a/8/5/a85c303a45cd7a6b3745cb9aaa6b4f19.jpg -A "GOAI-SearchBot/1.4; +https://openai.com/searchbot" 2>&1 | grep -A5 418

    - name: Show container's logs and thumbnails cache
      if: always()
      run: |
        set -x
        ls -lha thumbnails/
        docker compose logs
